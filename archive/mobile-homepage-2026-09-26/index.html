<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Shop natural-looking human hair toppers, clip-in extensions and fringes, or book a consultation for permanent extensions and wigs at Alchemane, Khar West." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/source-sans-3-regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/source-serif-4-regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" as="image" href="/assets/hero-mobile-portrait-780.webp" imagesrcset="/assets/hero-mobile-portrait-780.webp 780w, /assets/hero-mobile-portrait-1024.webp 1024w" imagesizes="100vw" media="(max-width: 600px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/assets/hero.webp" imagesrcset="/assets/hero-1280.webp 1280w, /assets/hero.webp 2400w, /assets/hero-3200.webp 3200w" imagesizes="100vw" media="(min-width: 601px)" fetchpriority="high" />
    <title>Alchemane | Human Hair Toppers, Extensions &amp; Wigs</title>
  </head>
  <body>
    <a href="#range" class="skip-link">Skip to products</a>
    <main id="home">
      <div class="experience">
        <div class="stage">
          <section class="hero-scene" aria-label="Alchemane hair extensions">
            <header class="site-header">
              <div class="masthead">
                <a class="brand" href="#home" aria-label="Alchemane home">
                  <img class="brand-logo" src="/icons/new%20logo.svg" alt="" width="160" height="40" />
                </a>
                <nav id="main-navigation" aria-label="Main navigation" class="main-nav">
                  <a href="#home" aria-current="page">Home</a>
                  <a href="#range" data-catalogue-category="extensions">Extensions</a>
                  <a href="#range" data-catalogue-category="toppers">Toppers</a>
                  <a href="#range" data-catalogue-category="wigs">Wigs</a>
                </nav>
                <div class="header-actions">
                  <a class="header-cta" href="#consultation">Book a consultation</a>
                  <button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-controls="main-navigation" aria-expanded="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
                  </button>
                </div>
              </div>
            </header>
            <div class="hero-visual">
              <h1 class="sr-only">Natural-looking human hair toppers, extensions and wigs.</h1>
              <div class="hero-art">
                <picture>
                  <source media="(max-width: 600px)" srcset="/assets/hero-mobile-portrait-780.webp 780w, /assets/hero-mobile-portrait-1024.webp 1024w" sizes="100vw" width="1024" height="1536">
                  <img src="/assets/hero.webp" srcset="/assets/hero-1280.webp 1280w, /assets/hero.webp 2400w, /assets/hero-3200.webp 3200w" sizes="100vw" alt="Three women showing Alchemane's ponytail, naturally blended hair topper, and halo hair extension." width="2400" height="1351" fetchpriority="high" />
                </picture>
              </div>
              <div class="hero-ground" aria-hidden="true"></div>
              <div class="hero-actions">
                <a class="collection-cta" href="#collection">Find your hair solution</a>
                <a class="scroll-cue" href="#collection"><span>See your options</span><svg viewBox="0 0 20 28" aria-hidden="true"><path d="M10 1v24m-6-6 6 6 6-6" /></svg></a>
              </div>
            </div>
          </section>

          <section class="collection-scene" id="collection" aria-labelledby="collection-title">
            <div class="collection-content">
              <div class="collection-lockup">
                <p class="collection-kicker">Shop or book</p>
                <h2 id="collection-title" tabindex="-1">
                  <span class="collection-title-line">Find your</span>
                  <em class="collection-title-line collection-title-line--italic">hair solution.</em>
                </h2>
              </div>
              <!-- collection-discovery -->
            </div>
          </section>

          <div class="cloud-stage cloud-stage-mobile" aria-hidden="true">
            <div class="cloud-layer cloud-far"><img src="/assets/cloud.webp" alt="" /></div>
            <div class="cloud-layer cloud-near"><img src="/assets/cloud.webp" alt="" /></div>
            <div class="cloud-layer cloud-front"><img src="/assets/cloud.webp" alt="" /></div>
            <div class="whiteout"></div>
          </div>

          <div class="cloud-stage cloud-stage-desktop" aria-hidden="true">
            <div class="cloud-layer cloud-far"><img src="/assets/cloud.webp" alt="" /></div>
            <div class="cloud-layer cloud-near"><img src="/assets/cloud.webp" alt="" /></div>
            <div class="cloud-layer cloud-front"><img src="/assets/cloud.webp" alt="" /></div>
            <div class="whiteout"></div>
          </div>
        </div>
      </div>
      <!-- product-discovery -->
      <!-- homepage-sections -->
    </main>

    <aside class="floating-contact" aria-label="Quick contact">
      <a class="floating-contact-link floating-contact-link--whatsapp" href="https://wa.me/919967123333" target="_blank" rel="noopener noreferrer" aria-label="Chat with Alchemane on WhatsApp">
        <img src="/icons/logos_whatsapp-icon.svg" alt="" width="76" height="76">
      </a>
      <a class="floating-contact-link floating-contact-link--call" href="tel:+919967123333" aria-label="Call Alchemane at +91 99671 23333">
        <img src="/icons/Calling%20icon-1.svg" alt="" width="76" height="76">
      </a>
    </aside>

    <dialog class="product-dialog" aria-labelledby="product-title">
      <button class="dialog-close" aria-label="Close collection detail"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6" /></svg></button>
      <img class="dialog-image" src="/assets/hair-toppers.webp" alt="" width="480" height="480" />
      <div class="dialog-content"><p class="eyebrow">Your hair options</p><h2 id="product-title"></h2><p class="product-description"></p><button class="dialog-return"><span class="dialog-return-label">See all hair solutions</span> <span aria-hidden="true">↗</span></button></div>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
